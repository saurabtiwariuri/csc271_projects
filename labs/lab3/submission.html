<!DOCTYPE html>
    <html lang="en"></html>
    <head>
        <title> Submit Favorite Dish!</title>
    </head>
    <body>
        <form action="index.html">
            <label for="recipename">Recipe Name:</label><br>
            <input type="text" id="recipename" name="recipename"><br>
            <label for="ingredients">Ingredients:</label><br>
            <input type="text" id="ingredients" name="ingredients"><br>
            <label for="instructions">Instructions:</label><br>
            <textarea id="instructions" name="instructions" rows="4" cols="50"></textarea>
            <br>
            <label for="difficulty">Difficulty:</label><br>
            <input type="radio" id="easy" name="difficulty" value="easy">
            <label for="easy">Easy</label><br>
            <input type="radio" id="medium" name="difficulty" value="medium">
            <label for="medium">Medium</label><br>
            <input type="radio" id="hard" name="difficulty" value="hard">
            <label for="hard">Hard</label><br>
            <br>
            <label for="diet">Dietary Preferences:</label><br>
            <input type="checkbox" id="Vegetarian" name="Vegetarian" value="vegetarian">
            <label for="Vegetarian">Vegetarian</label><br>
            <input type="checkbox" id="Vegan" name="Vegan" value="vegan">
            <label for="Vegan">Vegan</label><br>
            <input type="checkbox" id="Non-Vegetarian" name="Non-Vegetarian" value="non-vegetarian">
            <label for="Non-Vegetarian">Non-Vegetarian</label>
            <br><br>
            <button type="submit">Submit</button>
            <br><br>
            <a href="index.html">Back to Favorite Dishes</a>
        </form>
    </body>
</html>
